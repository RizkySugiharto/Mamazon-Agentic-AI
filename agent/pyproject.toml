[project]
name = "mamazon-spade-agent"
version = "0.1.0"
description = "Discord bot + validation core for Mamazon PP/Buzzer submissions"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "discord.py>=2.3.0",
    # Google Sheets / Drive
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
]

[project.optional-dependencies]
# Tencent Hunyuan Vision is optional — OpenRouter is the default backend.
tencent = ["tencentcloud-sdk-python>=3.0.700"]
dev = ["pytest>=8.0.0"]

[project.scripts]
mamazon = "src.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
