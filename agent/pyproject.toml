[project]
name = "mamazon-spade-agent"
version = "0.1.0"
description = "Discord bot + validation core for Mamazon PP/Buzzer submissions"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "discord.py>=2.3.0",
    # Google Sheets / Drive
    "google-api-python-client>=2.100.0",
    "google-auth>=2.25.0",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "zvec>=0.8.0",
    "fastembed>=0.9.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo_search>=7.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mamazon = "src.main:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
